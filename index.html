<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#b98af4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="惟境" />
    <script>
      /* iOS standalone runs full screen (status-bar style black-translucent): the
         chat wallpaper extends under the notch and the home indicator. Restore the
         last theme and wallpaper top colour before React and CSS paint. */
      (() => {
        try {
          /* In iOS standalone neither 100% nor 100vh/100dvh matches the physical
             screen (100% stops above the home indicator, 100vh overshoots and sinks
             the composer). Pin the app to the screen size instead; ordinary
             browsers never get the inline heights and keep 100% / 100dvh. */
          const ios = /iP(?:hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
          const standalone = navigator.standalone === true || (ios && window.matchMedia('(display-mode: standalone)').matches)
          if (standalone) {
            const root = document.documentElement
            root.setAttribute('data-standalone', '')
            /* The app height is written as an inline `height` on the few layout boxes
               that need it (html, body, #root, .app-shell, .phone-canvas and the
               expanded composer), never as an inherited custom property: an inherited
               --app-h restyled every message node on each keyboard frame, and the
               non-inherited @property + `inherit` chain tried in 2ec61d3 is not
               invalidated reliably by iOS WebKit (the chat kept its pre-keyboard
               height and the composer slid under the keyboard). `height` is not
               inherited, so a write restyles only these boxes. Write only when the
               value changes: iOS fires visualViewport resize/scroll on every frame
               of the keyboard animation. */
            let lastH = null
            const writeHeights = (h) => {
              const wide = window.innerWidth >= 700
              const boxes = [root, document.body, document.getElementById('root'), ...document.querySelectorAll('.app-shell, .phone-canvas, .composer-expanded-layer')]
              for (const box of boxes) {
                if (!box) continue
                const value = h === null ? '' : wide && box.classList.contains('phone-canvas') ? `calc(${h} - 56px)` : h
                if (box.__weijingAppH === value) continue
                box.__weijingAppH = value
                box.style.height = value
              }
            }
            /* React calls this after mounting/re-rendering the layout boxes so new
               ones (e.g. the expanded composer) get the current height at once. */
            window.__weijingApplyAppHeight = () => writeHeights(lastH)
            let lastKb = null
            /* The app listens for these to keep the chat pinned to its newest message
               while the keyboard opens/closes (src/keyboardScrollPin.ts): "will-change"
               fires before the relayout so it can still see whether the list was at
               the bottom, "change" after it so it can re-pin. */
            const notify = (type, kb) => { try { window.dispatchEvent(new CustomEvent(type, { detail: { kb } })) } catch {} }
            const apply = (h, kb) => {
              if (kb === lastKb && h === lastH) return
              notify('weijing:viewport-will-change', kb)
              if (kb !== lastKb) { if (kb) root.setAttribute('data-kb', ''); else root.removeAttribute('data-kb'); lastKb = kb }
              if (h !== lastH) { lastH = h; writeHeights(h) }
              notify('weijing:viewport-change', kb)
            }
            const measure = () => {
              const portrait = window.matchMedia('(orientation: portrait)').matches
              const long = Math.max(screen.width, screen.height)
              const short = Math.min(screen.width, screen.height)
              const width = portrait ? short : long
              /* iPad split view / Slide Over: the window is narrower than the screen,
                 so the screen height would be wrong; fall back to the normal 100%. */
              if (Math.abs(window.innerWidth - width) > 2) { apply(null, false); return }
              const full = portrait ? long : short
              /* Keyboard open: shrink the app to the visible area so the composer sits on
                 top of the keyboard and iOS doesn't pan the whole page up under the clock. */
              const vv = window.visualViewport
              if (vv && vv.height < full - 120) {
                apply(`${Math.round(vv.height)}px`, true)
                if (window.scrollY || vv.offsetTop) window.scrollTo(0, 0)
              } else {
                apply(`${full}px`, false)
              }
            }
            let frame = 0
            const setAppHeight = () => {
              if (frame) return
              frame = requestAnimationFrame(() => { frame = 0; measure() })
            }
            measure()
            /* Re-run by the app after it blurs the composer: iOS sometimes skips the
               final visualViewport resize when the keyboard closes. */
            window.__weijingSyncViewport = setAppHeight
            window.addEventListener('orientationchange', () => setTimeout(setAppHeight, 150))
            window.addEventListener('resize', setAppHeight)
            if (window.visualViewport) {
              window.visualViewport.addEventListener('resize', setAppHeight)
              window.visualViewport.addEventListener('scroll', setAppHeight)
            }
          }
          const wallTop = localStorage.getItem('weijing.wallTopColor')
          if (wallTop && /^#[0-9a-f]{6}$/i.test(wallTop)) document.documentElement.style.setProperty('--wall-top', wallTop)
        } catch {}
        try {
          const storedPwaColor = localStorage.getItem('weijing.pwaThemeColor')
          const storedChatColor = localStorage.getItem('weijing.chatBaseColor')
          let themeColor = storedPwaColor
          if (!themeColor && storedChatColor) {
            try { themeColor = JSON.parse(storedChatColor) } catch { themeColor = storedChatColor }
          }
          if (typeof themeColor === 'string' && /^#[0-9a-f]{6}$/i.test(themeColor)) {
            document.documentElement.style.backgroundColor = themeColor
            document.documentElement.style.setProperty('--launch-theme-color', themeColor)
            document.querySelector('meta[name="theme-color"]')?.setAttribute('content', themeColor)
          }
        } catch {}
      })()
    </script>
    <link rel="icon" type="image/png" href="/wewei-role-site/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/wewei-role-site/apple-touch-icon.png" />
    <link rel="manifest" href="/wewei-role-site/manifest.webmanifest" />
    <title>惟境</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
